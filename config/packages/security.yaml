security:
    role_hierarchy:
        ROLE_ADMIN: [ROLE_MANAGER]
        ROLE_MANAGER: [ROLE_TELLER]
        ROLE_TELLER: [ROLE_WAITER]
        ROLE_WAITER: [ROLE_USER]

    password_hashers:
        App\Entity\Security\User:
            algorithm: auto


    providers:
        app_user_provider:
            entity:
                class: App\Entity\Security\User
                property: email
        # used to reload user from session & other features (e.g. switch_user)

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/v1/user/login
            stateless: true
            json_login:
                check_path: /api/v1/user/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            jwt: ~
            refresh_jwt:
                check_path: /api/v1/token/refresh

    access_control:
        - { path: ^/api/v1/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/user/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/user/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/(login|token/refresh), roles: PUBLIC_ACCESS }
        
        # Routes statistic
        - { path: ^/api/v1/sale_history, roles: ROLE_TELLER }
        
        # Routes checkout
        - { path: ^/api/v1/checkout/orders$, roles: ROLE_WAITER }
        - { path: ^/api/v1/checkout/order$, roles: ROLE_WAITER }
        - { path: ^/api/v1/checkout/sale$, roles: ROLE_TELLER }
        - { path: ^/api/v1/checkout/cancel$, roles: ROLE_MANAGER }
        - { path: ^/api/v1/checkout/cancelsale$, roles: ROLE_MANAGER }
        - { path: ^/api/v1/checkout/order/\d+$, roles: ROLE_MANAGER }
        
        # Routes checkout
        - { path: ^/api/v1/stock-movement, roles: ROLE_MANAGER }
        
        # Routes user
        - { path: ^/api/v1/company/current$, roles: ROLE_WAITER }
        - { path: ^/api/v1/company/logo$, roles: ROLE_WAITER }
        - { path: ^/api/v1/company, roles: ROLE_ADMIN }

        # Routes facturation
        - { path: ^/api/v1/invoice, roles: ROLE_WAITER }

        # Routes images clients
        - { path: ^/api/v1/customer, roles: ROLE_WAITER }
        
        # Routes category
        - { path: ^/api/v1/category, roles: ROLE_WAITER }
        
        # Routes product
        - { path: ^/api/v1/product, roles: ROLE_MANAGER }

        # Routes supplier
        - { path: ^/api/v1/supplier, roles: ROLE_WAITER }

        - { path: ^/api/v1,   roles: IS_AUTHENTICATED_FULLY }