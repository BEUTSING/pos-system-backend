nelmio_api_doc:
    documentation:
        info:
            title: POS API Documentation
            description:  Point of Sale Management API
            version: 1.0.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                    description: 'Enter JWT token in the format: Bearer {token}. Token includes company context for multi-tenant operations.'
        security:
            - Bearer: []
        tags:
            - name: Authentication
            - name: Users
            - name: Product
            - name: Category
            - name: Supplier
            - name: Checkout
            - name: StockMovement
            - name: Statistics
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
        